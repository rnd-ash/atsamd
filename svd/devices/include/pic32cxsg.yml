## Copied from D5x (See note about specific PIC32CXSG patches)

# CCBUF & DITHERBUF wrong offset & size for CCBUF_DITH4_MODE
"TCC?":
  "CCBUF_DITH4_MODE?%s?":
    _modify:
      DITHERBUF:
        bitOffset: 0
        bitWidth: 4
      CCBUF:
        bitOffset: 4
        bitWidth: 20

# The NVMCTRL::PARAM::SEE field is specified as 1 bit wide, but several
# devices include much wider enumeration values that don't correspond to
# the actual values expected for this field.
NVMCTRL:
  PARAM:
    SEE:
      _replace_enum:
        _name: SEESelect
        SMARTEEPROM: [0x1, "SmartEEPROM is supported"]
        NOSMARTEEPROM: [0x0, "No SmartEEPROM support"]
    PSZ: # PIC32CXSG specific (PSZ fields are renamed from `PSZ_x` to 'x')
      _replace_enum:
        _name: PSZ
        PSZ_8: [0x0, "8 bytes"]
        PSZ_16: [0x1, "16 bytes"]
        PSZ_32: [0x2, "32 bytes"]
        PSZ_64: [0x3, "64 bytes"]
        PSZ_128: [0x4, "128 bytes"]
        PSZ_256: [0x5, "256 bytes"]
        PSZ_512: [0x6, "512 bytes"]
        PSZ_1024: [0x7, "1024 bytes"]

  SEECFG: # PIC32CXSG specific (BUFFERED is missing)
    WMODE:
      _replace_enum:
        _name: WMODE
        UNBUFFERED: [0x0, "A NVM write command is issued after each write in the pagebuffer"]
        BUFFERED: [0x1, "A NVM write command is issued when a write to a new page is requested"]

# The SDHC peripheral on some devices contains reset values for certain
# fields that are wider than their corresponding storage. Replace the
# invalid values with the ones from the datasheet.
"SDHC?":
  _modify:
    HC1R:
      resetValue: 0x00
    HC1R_EMMC_MODE:
      resetValue: 0x00
    SISR:
      resetValue: 0x00

# The TCn::COUNTn::CTRLA::DMAOS fields are all missing.
"TC?":
  "*":
    CTRLA:
      _add:
        DMAOS:
          description: DMA One-Shot Trigger Mode
          bitOffset: 15
          bitWidth: 1

# EVSYS::CHANNEL[%s] cluster is misnamed; should be CHANNELS[%s].
EVSYS:
  _modify:
    "CHANNEL?%s?":
      name: "CHANNELS[%s]"

# The SERCOM USART TXPO enumerated values of the original SVD don't match
# the datasheet.
"SERCOM?":
  USART_INT:
    CTRLA:
      TXPO:
        _replace_enum:
          _name: TXPOSelect
          TXPO_0: [0x0, "TxD on PAD0, XCK on PAD1"]
          TXPO_2: [0x2, "TxD on PAD0, RTS/TE on PAD2, CTS on PAD3"]
          TXPO_3: [0x3, "TxD on PAD0, XCK on PAD1, RTS/TE on PAD2"]
  USART_EXT:
    CTRLA:
      TXPO:
        _replace_enum:
          _name: TXPOSelect
          TXPO_0: [0x0, "TxD on PAD0, XCK on PAD1"]
          TXPO_2: [0x2, "TxD on PAD0, RTS/TE on PAD2, CTS on PAD3"]
          TXPO_3: [0x3, "TxD on PAD0, XCK on PAD1, RTS/TE on PAD2"]
  SPIM: # PIC32CXSG - MSSEN is missing from SPI CTRLB
    CTRLB:
      _add:
        MSSEN:
          bitOffset: 13
          bitWidth: 1
          description: "Host SPI Select Enable"
          resetValue: 0
          access: READ_WRITE


